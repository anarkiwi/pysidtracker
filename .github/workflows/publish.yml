# Publishes pysidtracker to PyPI when a GitHub release is published, using
# PyPI trusted publishing (OIDC) -- no API token stored in the repo.
#
# Setup checklist (do this once, in the repository's GitHub settings):
#   1. Register the project on PyPI:
#        https://pypi.org/manage/account/publishing/
#      Add a new "pending" trusted publisher with:
#        - PyPI project name:  pysidtracker
#        - Owner:              anarkiwi
#        - Repository name:    pysidtracker
#        - Workflow filename:  publish.yml
#        - Environment name:   pypi
#   2. In this repo, create an Environment named "pypi" (Settings ->
#      Environments -> New environment). No secrets are required when
#      using trusted publishing.
#
# After the trusted publisher is configured, pushing a version tag (or publishing a GitHub
# release) builds the manylinux wheels carrying the native call machine and the sdist, and
# uploads them via OIDC -- no PyPI token needed.

name: publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # abi3-py311: one cp311-abi3 wheel per platform serves 3.11 and later.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/smoke/bin/python -c "import pysidtracker; from pysidtracker.playspec import native; assert native.available(); print(pysidtracker.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Only on a version tag or a real release, not on workflow_dispatch dry runs.
    if: github.event_name != 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/pysidtracker/
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
